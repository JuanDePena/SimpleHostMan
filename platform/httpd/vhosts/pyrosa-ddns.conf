<Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
  Options None
  AllowOverride None
  Require all granted
</Directory>

<VirtualHost *:80>
  ServerName ddns.pyrosa.com.do

  Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
  ProxyPass /.well-known/acme-challenge/ !
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

  ErrorLog /var/log/httpd/ddns.pyrosa.com.do_error.log
  CustomLog /var/log/httpd/ddns.pyrosa.com.do_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName ddns.pyrosa.com.do

  SSLEngine on
  SSLCertificateFile /etc/ssl/simplehostman/pyrosa.com.do/fullchain.pem
  SSLCertificateKeyFile /etc/ssl/simplehostman/pyrosa.com.do/privkey.pem

  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Cache-Control "no-store"

  ProxyPreserveHost On
  ProxyRequests Off
  ProxyAddHeaders On
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"

  ProxyPass /nic/update http://127.0.0.1:3200/nic/update nocanon retry=0 timeout=30
  ProxyPassReverse /nic/update http://127.0.0.1:3200/nic/update

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/nic/update$
  RewriteRule ^ - [R=404,L]

  ErrorLog /var/log/httpd/ddns.pyrosa.com.do_ssl_error.log
  CustomLog /var/log/httpd/ddns.pyrosa.com.do_ssl_access.log combined
</VirtualHost>
</IfModule>
