<VirtualHost *:80>
  ServerName rustdesk.pyrosa.com.do

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

  ErrorLog /var/log/httpd/rustdesk.pyrosa.com.do_error.log
  CustomLog /var/log/httpd/rustdesk.pyrosa.com.do_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName rustdesk.pyrosa.com.do

  AllowEncodedSlashes NoDecode

  SSLEngine on
  SSLCertificateFile /etc/ssl/simplehostman/pyrosa.com.do/fullchain.pem
  SSLCertificateKeyFile /etc/ssl/simplehostman/pyrosa.com.do/privkey.pem

  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  ProxyPreserveHost On
  ProxyRequests Off
  ProxyAddHeaders On
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"

  <LocationMatch "^/(?:auth|actions|login|proxy-vhost|resources|v1)(?:/|$)">
    Require all denied
  </LocationMatch>

  ProxyPass / http://127.0.0.1:3200/ nocanon retry=0 timeout=60
  ProxyPassReverse / http://127.0.0.1:3200/

  ErrorLog /var/log/httpd/rustdesk.pyrosa.com.do_ssl_error.log
  CustomLog /var/log/httpd/rustdesk.pyrosa.com.do_ssl_access.log combined
</VirtualHost>
</IfModule>
